name: Build and Release Prebuilt Tarball

on:
  push:
    tags: ["*"]

jobs:
  build-prebuild:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup the best engine ever
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Bake Jotty
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: 1
        run: yarn build

      - name: Get version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Structure the prebuild stuff
        run: |
          mkdir -p prebuild-release/jotty/.next
          cp -r .next/standalone/. prebuild-release/jotty/
          cp -r .next/static prebuild-release/jotty/.next/static
          if [ -f .next/BUILD_ID ]; then
            cp .next/BUILD_ID prebuild-release/jotty/.next/BUILD_ID
          fi
          cp -r public prebuild-release/jotty/public
          cp -r howto prebuild-release/jotty/howto

      - name: Create tarball - tarball is a funny name
        run: |
          cd prebuild-release
          tar -czf jotty_${{ steps.version.outputs.version }}_prebuild.tar.gz jotty
          sha256sum jotty_${{ steps.version.outputs.version }}_prebuild.tar.gz > jotty_${{ steps.version.outputs.version }}_prebuild.tar.gz.sha256

      - name: Attach to Release - pray it works
        uses: softprops/action-gh-release@v2
        with:
          files: |
            prebuild-release/jotty_*_prebuild.tar.gz
            prebuild-release/jotty_*_prebuild.tar.gz.sha256
          tag_name: ${{ steps.version.outputs.version }}

  build-mcp:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup the other best engine ever
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Make sure it still works
        run: |
          bun run typecheck
          bun test

      - name: Bake the MCP
        run: bun run build

      - name: Get version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Structure the prebuild stuff
        run: |
          mkdir -p prebuild-release/jotty-mcp
          cp dist/main.js prebuild-release/jotty-mcp/main.js
          cp README.md prebuild-release/jotty-mcp/README.md
          cp ../LICENSE prebuild-release/jotty-mcp/LICENSE

      - name: Create tarball - a smaller funny name
        run: |
          cd prebuild-release
          tar -czf jotty-mcp_${{ steps.version.outputs.version }}_prebuild.tar.gz jotty-mcp
          sha256sum jotty-mcp_${{ steps.version.outputs.version }}_prebuild.tar.gz > jotty-mcp_${{ steps.version.outputs.version }}_prebuild.tar.gz.sha256

      - name: Attach to Release - pray it works twice
        uses: softprops/action-gh-release@v2
        with:
          files: |
            mcp-server/prebuild-release/jotty-mcp_*_prebuild.tar.gz
            mcp-server/prebuild-release/jotty-mcp_*_prebuild.tar.gz.sha256
          tag_name: ${{ steps.version.outputs.version }}
